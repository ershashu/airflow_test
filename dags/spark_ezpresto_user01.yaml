apiVersion: sparkoperator.hpe.com/v1beta2
kind: SparkApplication
metadata:
  name: spark-ezpresto-{{ts_nodash|replace("T", "")}}
spec:
  type: Python
  sparkVersion: 3.5.5
  mode: cluster
  image: '{{ params.airgap_registry_url }}hpe-spark/spark:v3.5.5.2.1'
  imagePullPolicy: Always
  mainApplicationFile: 'local:///mnt/shared/spark_test_data/ezpresto_query.py'
  timeToLiveSeconds: 86400
  arguments:
    - '{{ params.query }}'
  restartPolicy:
    type: Never
  imagePullSecrets:
    - imagepull
  driver:
    cores: 1
    coreLimit: 1000m
    memory: 1024m
    labels:
      version: 3.5.5
  executor:
    cores: 1
    coreLimit: 1000m
    instances: 1
    memory: 2G
    labels:
      version: 3.5.5
