apiVersion: sparkoperator.hpe.com/v1beta2
kind: SparkApplication
metadata:
  name: spark-ezpresto-{{ts_nodash|replace("T", "")}}
spec:
  type: Python
  sparkVersion: 3.5.1
  mode: cluster
  image: '{{ params.airgap_registry_url }}gcr.io/mapr-252711/spark-3.5.1:v3.5.1.0.1'
  imagePullPolicy: Always
  mainApplicationFile: 'local:///mounts/shared-volume/spark_test_data/ezpresto_query.py'
  timeToLiveSeconds: 86400
  arguments:
    - '{{ params.query }}'
  restartPolicy:
    type: Never
  imagePullSecrets:
    - imagepull
  driver:
    cores: 1
    coreLimit: 1000m
    memory: 1024m
    labels:
      version: 3.5.1
  executor:
    cores: 1
    coreLimit: 1000m
    instances: 1
    memory: 2G
    labels:
      version: 3.5.1
